<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Coach</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <header class="topbar">
    <h1 class="brand"><span class="logo" aria-hidden="true"></span><span class="brand-name">LoL Coach</span></h1>
    <div class="status">
      <span id="clock" class="clock"></span>
      <span id="phase" class="pill" role="status">Conectando…</span>
    </div>
  </header>
  <main id="app"></main>
  <div id="announce" class="sr-only" role="status"></div>
  <footer class="footer">
    <span id="connection" class="dot off" aria-hidden="true"></span>
    <span id="connection-text">Conectando con LoL Coach…</span>
    <span id="version" class="version"></span>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
